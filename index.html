<html lang="en">
<head>

<title>RVS-IT Learning Portal · CS25C07 OOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-raised: #f1f5f9;
  --ink: #0f172a;
  --mut: #64748b;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-glow: rgba(79, 70, 229, 0.18);
  --cyan-glow: #06b6d4;
  --ln: #e2e8f0;
  --code-bg: #090d16;
  --code-txt: #e2e8f0;
  --bad: #ef4444;
  --bad-bg: #fef2f2;
  --ok: #10b981;
  --ok-bg: #ecfdf5;
  --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
}

:root[data-theme="dark"] {
  --bg: #090d16;
  --surface: #111827;
  --surface-raised: #1f293d;
  --ink: #f8fafc;
  --mut: #94a3b8;
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --primary-glow: rgba(99, 102, 241, 0.28);
  --cyan-glow: #22d3ee;
  --ln: #243048;
  --code-bg: #05070c;
  --code-txt: #cbd5e1;
  --bad: #f87171;
  --bad-bg: rgba(239, 68, 68, 0.12);
  --ok: #34d399;
  --ok-bg: rgba(16, 185, 129, 0.12);
  --card-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 "Plus Jakarta Sans", system-ui, sans-serif;
  transition: background-color 0.2s ease, color 0.2s ease;
}

header {
  padding: 22px 24px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--ln);
  position: sticky;
  top: 0;
  z-index: 40;
  backdrop-filter: blur(12px);
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1040px;
  margin: 0 auto 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-badge {
  background: linear-gradient(135deg, var(--primary), var(--cyan-glow));
  color: #fff;
  font-weight: 700;
  font-size: 0.82rem;
  padding: 4px 10px;
  border-radius: 6px;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 10px var(--primary-glow);
}
h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.2px; }
.header-sub { margin: 2px 0 0; color: var(--mut); font-size: 0.85rem; }

.theme-btn {
  background: var(--surface-raised);
  border: 1px solid var(--ln);
  color: var(--ink);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.theme-btn:hover { border-color: var(--primary); color: var(--primary); }

.bar-box { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 7px; background: var(--surface-raised); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan-glow)); width: 0; transition: width 0.4s ease; }
.prog-text { font-size: 0.78rem; font-weight: 600; color: var(--mut); white-space: nowrap; }

nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--ln);
  max-width: 1040px;
  margin: 0 auto;
}
nav button {
  flex: none;
  border: 1px solid var(--ln);
  background: var(--surface);
  color: var(--mut);
  padding: 8px 14px;
  border-radius: 8px;
  font: inherit;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
nav button:hover { color: var(--ink); border-color: var(--mut); }
nav button.on {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px var(--primary-glow);
}

main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 60px; }
.unit-head { margin-bottom: 20px; }
.unit-badge {
  display: inline-block;
  background: var(--primary-glow);
  color: var(--primary);
  font-weight: 700;
  font-size: 0.76rem;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 6px;
}
h2 { margin: 0 0 6px; font-size: 1.45rem; font-weight: 700; }
.syl { color: var(--mut); font-size: 0.92rem; margin: 0; line-height: 1.5; }

section {
  background: var(--surface);
  border: 1px solid var(--ln);
  border-radius: 12px;
  padding: 22px;
  margin: 22px 0;
  box-shadow: var(--card-shadow);
}
h3 { margin: 0 0 14px; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

details { border-top: 1px solid var(--ln); padding: 12px 0; }
details:first-of-type { border-top: 0; padding-top: 0; }
summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 0.98rem;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
summary::-webkit-details-marker { display: none; }
summary::before {
  content: "›";
  display: inline-block;
  font-size: 1.2rem;
  transition: transform 0.2s;
  color: var(--primary);
}
details[open] summary::before { transform: rotate(90deg); }
details ul { margin: 10px 0 4px; padding-left: 24px; }
details li { margin-bottom: 8px; line-height: 1.55; }
code {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.88em;
  background: var(--surface-raised);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--primary);
}

/* Chatbot Widget */
.chat-container {
  display: flex;
  flex-direction: column;
  height: 420px;
  border: 1px solid var(--ln);
  border-radius: 10px;
  background: var(--bg);
  overflow: hidden;
}
.chat-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-msg {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 0.9rem;
  line-height: 1.5;
}
.chat-msg.bot {
  align-self: flex-start;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--ln);
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
}
.chat-msg.bot ul { margin: 6px 0 0; padding-left: 18px; }
.chat-msg.bot li { margin-bottom: 4px; }
.chat-msg.user {
  align-self: flex-end;
  background: var(--primary);
  color: #ffffff;
  border-bottom-right-radius: 2px;
}
.chat-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 14px;
  background: var(--surface);
  border-top: 1px solid var(--ln);
}
.chat-chip {
  flex: none;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--surface-raised);
  color: var(--ink);
  border: 1px solid var(--ln);
  cursor: pointer;
  transition: all 0.2s;
}
.chat-chip:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.chat-bar {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  background: var(--surface);
  border-top: 1px solid var(--ln);
}
.chat-in {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--ln);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 0.9rem;
}
.chat-in:focus { outline: 2px solid var(--primary); border-color: transparent; }

/* Simulator */
textarea {
  width: 100%;
  min-height: 270px;
  background: var(--code-bg);
  color: var(--code-txt);
  border: 1px solid var(--ln);
  border-radius: 8px;
  padding: 14px;
  font: 13.5px/1.5 "JetBrains Mono", monospace;
  tab-size: 4;
  resize: vertical;
}
pre {
  background: var(--code-bg);
  color: var(--code-txt);
  padding: 14px;
  border-radius: 8px;
  min-height: 80px;
  margin: 12px 0 0;
  overflow-x: auto;
  font: 13.5px/1.5 "JetBrains Mono", monospace;
  white-space: pre-wrap;
  border: 1px solid var(--ln);
}
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
select, .btn {
  font: inherit;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--ln);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  font-size: 0.88rem;
}
.btn {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  cursor: pointer;
  transition: background 0.2s;
}
.btn:hover { background: var(--primary-hover); }
.btn.g { background: var(--surface-raised); color: var(--ink); border-color: var(--ln); }
.btn.g:hover { border-color: var(--mut); }
.err { color: var(--bad); }

/* Quiz */
.q {
  margin: 16px 0;
  padding: 16px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--ln);
}
.q b { display: block; margin-bottom: 10px; font-size: 0.95rem; font-weight: 600; }
.q button {
  display: block;
  width: 100%;
  text-align: left;
  margin: 6px 0;
  padding: 10px 14px;
  border: 1px solid var(--ln);
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  font: inherit;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.2s;
}
.q button:hover { border-color: var(--primary); }
.q button.r { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.q button.w { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.note { font-size: 0.82rem; color: var(--mut); }
</style>
</head>

  "<b>Static Member Functions:</b> Can only access static data members or other static member functions; invoked using class name: <code>ClassName::func()</code> without an object."
 ]
]],

{n:"Unit III",t:"Inheritance and Compile Time Polymorphism",s:"Derived classes, single, multilevel, multiple, hierarchical, hybrid inheritance; function and operator overloading; unary, binary, friend operators.",
notes:[
["1. Inheritance Principles & Types",
 [
  "<b>Concept:</b> Mechanism where a new derived class acquires properties and behaviors of an existing base class to enable reusability[cite: 45].",
  "<b>Syntax:</b> <code>class Derived : visibilityMode Base { ... };</code>[cite: 45]",
  "<b>Single Inheritance:</b> One derived class inherits from exactly one base class (Base &rarr; Derived)[cite: 45].",
  "<b>Multiple Inheritance:</b> One derived class inherits simultaneously from multiple base classes (Base1, Base2 &rarr; Derived)[cite: 46].",
  "<b>Multilevel Inheritance:</b> Derived class inherits from a class which is itself derived from another class (Class A &rarr; Class B &rarr; Class C)[cite: 49].",
  "<b>Hierarchical Inheritance:</b> Multiple derived classes inherit from a single common base class (Base &rarr; Derived1, Derived2, Derived3)[cite: 48].",
  "<b>Hybrid (Diamond) Inheritance:</b> Combination of two or more inheritance types (e.g., multilevel combined with multiple inheritance)[cite: 51]."
 ]
],
["2. Visibility Modes",
 [
  "<b>Private Members:</b> Never inherited directly by any derived class regardless of visibility mode.",
  "<b>Public Mode:</b> Public members of base remain public in derived; protected remain protected.",
  "<b>Protected Mode:</b> Public and protected members of base become protected in derived class.",
  "<b>Private Mode:</b> Public and protected members of base become private in the derived class."
 ]
],
["3. Compile-Time Polymorphism (Static Binding)",
 [
  "<b>Definition:</b> Function call is bound to code at compile-time based on argument types and count (Early / Static Binding)[cite: 53].",
  "<b>Mechanism:</b> Achieved in C++ via Function Overloading and Operator Overloading[cite: 53].",
  "<b>Advantages:</b> Fast execution since binding is determined early before runtime[cite: 71]."
 ]
],
["4. Operator Overloading: Unary & Binary",
 [
  "<b>Concept:</b> Giving additional special meanings to existing C++ operators when applied to user-defined types using operator functions: <code>ReturnType ClassName::operator op(argList)</code>[cite: 53].",
  "<b>Unary Operator Overloading:</b> Operates on one operand (e.g., <code>-S</code> or <code>++a</code>)[cite: 53]. Takes no parameters when defined as a member function; takes 1 object reference when declared as a friend function[cite: 54, 56].",
  "<b>Binary Operator Overloading:</b> Operates on two operands (e.g., <code>c3 = c1 + c2</code>). Member function takes 1 explicit argument (the right operand, left is calling object <code>*this</code>); friend function takes 2 explicit arguments[cite: 54, 55]."
 ]
],
["5. Operator Overloading with Friend Functions",
 [
  "<b>Syntax:</b> <code>friend ReturnType operator op(Type1 arg1, Type2 arg2);</code>[cite: 55]",
  "<b>Usage:</b> Required when the left operand of a binary operator is not a class object (e.g., <code>cout &lt;&lt; obj</code> or <code>10 + obj</code>)."
 ]
],
["6. Non-Overloadable Operators & Function Overloading vs Overriding",
 [
  "<b>Operators that CANNOT be overloaded:</b> <code>sizeof</code>, Member access (<code>.</code>), Pointer-to-member (<code>.*</code>), Scope resolution (<code>::</code>), Conditional ternary (<code>?:</code>)[cite: 56].",
  "<b>Function Overloading:</b> Multiple functions with the same name but different signatures within the same scope; resolved at compile-time[cite: 57, 58].",
  "<b>Function Overriding:</b> Derived class redefines a base class function with identical signature and return type; resolved at runtime[cite: 58]."
 ]
]],

{n:"Unit IV",t:"Pointers and Runtime Polymorphism",s:"Pointer arithmetic, this pointer, base/derived pointers, compile vs runtime polymorphism, virtual functions, late binding, abstract classes, pure virtual functions, virtual destructors, virtual base class.",
notes:[
["1. Pointers & Pointer Arithmetic",
 [
  "<b>Definition:</b> Derived data type storing the memory address of another variable: <code>int *ptr = &amp;a;</code>[cite: 59]. Indirection/dereferencing operator <code>*ptr</code> accesses or updates memory contents[cite: 59].",
  "<b>Increment / Decrement:</b> Adding or subtracting 1 changes the address by <code>sizeof(dataType)</code> bytes (e.g., <code>ptr++</code> adds 4 bytes for an integer pointer)[cite: 60].",
  "<b>Pointer Addition / Subtraction:</b> <code>ptr + k</code> increments address by <code>k * sizeof(type)</code>[cite: 61, 62]. Subtraction between two pointers of the same array yields the number of elements separating them[cite: 62, 63].",
  "<b>Pointer Comparisons:</b> Relational operators (<code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code>) check whether pointers point to the same memory address or evaluate against <code>NULL</code>[cite: 63, 64]."
 ]
],
["2. The 'this' Pointer",
 [
  "<b>Concept:</b> Implicit pointer passed into all non-static member functions pointing to the calling object instance[cite: 65].",
  "<b>Applications:</b> Resolves name ambiguities between parameters and member variables (<code>this-&gt;age = age;</code>), and facilitates method chaining by returning the current instance: <code>return *this;</code>[cite: 65, 66]."
 ]
],
["3. Pointers to Base and Derived Classes",
 [
  "<b>Base Pointer to Derived:</b> A base class pointer can hold the address of a derived class object[cite: 68, 71].",
  "<b>Default Behavior:</b> Without virtual functions, calling a function through a base pointer invokes the base version because binding occurs at compile time based on pointer type[cite: 71]."
 ]
],
["4. Virtual Functions & Late Binding",
 [
  "<b>Virtual Function:</b> Declared in base class using the <code>virtual</code> keyword; tells compiler to perform dynamic/late binding at runtime based on the actual object being pointed to[cite: 71, 72].",
  "<b>Late Binding:</b> Code matching is postponed until execution time, enabling true runtime polymorphism[cite: 72].",
  "<b>Compile-Time vs Run-Time Polymorphism:</b> Compile-time is resolved by compiler, provides faster execution, and relies on overloading; Runtime polymorphism is resolved dynamically, provides greater flexibility, and relies on virtual functions and inheritance[cite: 70, 71]."
 ]
],
["5. Pure Virtual Functions & Abstract Classes",
 [
  "<b>Pure Virtual Function:</b> Declared with <code>= 0</code> with no body in the base class: <code>virtual void draw() = 0;</code>[cite: 73].",
  "<b>Abstract Class:</b> Any class with at least one pure virtual function; serves as an interface and cannot be instantiated directly (<code>Shape s;</code> gives compiler error)[cite: 73, 74]. Derived classes must override all pure virtual functions to be instantiated[cite: 73]."
 ]
],
["6. Virtual Destructors & Virtual Base Classes",
 [
  "<b>Virtual Destructor:</b> If a derived object is deleted via a base class pointer without a virtual destructor (<code>virtual ~Base()</code>), only the base destructor executes, resulting in undefined behavior and resource leaks[cite: 75].",
  "<b>Virtual Base Class:</b> Resolves diamond inheritance ambiguity where derived class inherits duplicate copies of a common ancestor base class (e.g., <code>class B : virtual public A</code>)[cite: 76, 78]. Ensures only one shared copy of base class members exists in the child class[cite: 78, 79]."
 ]
]],

{n:"Unit V",t:"Templates and Exception Handling",s:"Class templates, function templates, overloading template functions, strings, iterators, hashes, IO streams, exception handling.",
notes:[
["1. Function Templates & Class Templates",
 [
  "<b>Templates:</b> Blueprint for generic programming allowing a single code definition to support multiple data types[cite: 80].",
  "<b>Function Template:</b> Defines generic functions for a family of types: <code>template &lt;class T&gt; T add(T a, T b) { return a + b; }</code>[cite: 80].",
  "<b>Class Template:</b> Creates a generic class family parameterized by type: <code>template &lt;class T&gt; class Sample { T val; };</code>. Instantiated using concrete types: <code>Sample&lt;int&gt; obj1;</code>[cite: 81]."
 ]
],
["2. Overloading Template Functions",
 [
  "<b>Concept:</b> A template function can be overloaded with another template function with different parameter counts or with a normal non-template function[cite: 81].",
  "<b>Resolution Priority:</b> When an explicit non-template function matches the invocation arguments exactly, the compiler selects the non-template version over generic template functions[cite: 81, 83]."
 ]
],
["3. STL Strings, Iterators & Hashes",
 [
  "<b>std::string Class:</b> Sequence of characters providing member operations like <code>insert()</code>, <code>replace()</code>, <code>erase()</code>, <code>append()</code>, and <code>length()</code>[cite: 84].",
  "<b>Iterators:</b> Pointer-like objects used to traverse elements of STL containers without exposing internal structures: <code>for(auto it = v.begin(); it != v.end(); ++it)</code>[cite: 83]. Categories include Input, Output, Forward, Bidirectional, and Random Access[cite: 83].",
  "<b>std::hash Functor:</b> Unary function object generating hash code integers for keys; used by STL unordered associative containers[cite: 85]."
 ]
],
["4. Standard I/O Streams",
 [
  "<b>Streams:</b> Sequences of bytes transferred between devices and memory. Defined in <code>&lt;iostream&gt;</code>[cite: 86].",
  "<b>cin:</b> Object of <code>istream</code> class; reads input from keyboard using extraction operator <code>&gt;&gt;</code>[cite: 86].",
  "<b>cout:</b> Object of <code>ostream</code> class; writes output using insertion operator <code>&lt;&lt;</code>[cite: 86].",
  "<b>cerr:</b> Unbuffered standard error stream; flushes and displays error messages instantly[cite: 87].",
  "<b>clog:</b> Buffered standard error stream; buffers error log output until flushed[cite: 92]."
 ]
],
["5. Exception Handling Principles & Mechanisms",
 [
  "<b>Exceptions:</b> Runtime abnormal conditions (divide by zero, invalid input, memory exhaustion)[cite: 88]. Synchronous (internal program events like out-of-range) vs Asynchronous (external hardware interrupts)[cite: 88].",
  "<b>Mechanism:</b> Implemented through three primary keywords: <code>try</code>, <code>throw</code>, and <code>catch</code>[cite: 88].",
  "<b>try block:</b> Surrounds guarded code segments that could potentially produce errors[cite: 88].",
  "<b>throw keyword:</b> Throws an exception object to report an error condition[cite: 88].",
  "<b>catch block:</b> Follows the try block to intercept and handle the thrown exception object: <code>catch (int k) { ... }</code>. Catch-all syntax: <code>catch(...)</code> intercepts all unhandled types[cite: 88, 89]."
 ]
]],

{n:"Unit VI",t:"I/O Systems and File I/O",s:"C++ streams, formatted and unformatted I/O, file stream classes, file modes, file operations, sequential read/write, binary and ASCII files, error handling.",
notes:[
["1. Unformatted Input/Output Operations",
 [
  "<b>Extraction Operator (&gt;&gt;):</b> Reads input delimited by whitespace characters[cite: 92, 93].",
  "<b>get() and put():</b> Member functions of <code>istream</code>/<code>ostream</code> handling single characters including whitespace and newline characters: <code>cin.get(ch); cout.put(ch);</code>[cite: 94].",
  "<b>getline() &amp; write():</b> Line-oriented stream handling. <code>cin.getline(buffer, size)</code> reads entire line including spaces until <code>'\\n'</code> (replacing it with <code>'\\0'</code>); <code>cout.write(buffer, size)</code> displays specified number of bytes[cite: 95, 96]."
 ]
],
["2. Formatted Input/Output & Manipulators",
 [
  "<b>Formatted I/O:</b> Formats console output using manipulators from <code>&lt;iomanip&gt;</code>[cite: 97].",
  "<b>Manipulators:</b> <code>std::setw(width)</code> sets field display width, <code>std::setprecision(n)</code> controls floating-point digits, <code>std::setfill(ch)</code> sets padding characters, and base specifiers <code>std::hex</code>, <code>std::dec</code>[cite: 97]."
 ]
],
["3. File Stream Classes & Opening Modes",
 [
  "<b>Classes (&lt;fstream&gt;):</b> <code>ifstream</code> (reading), <code>ofstream</code> (writing), <code>fstream</code> (simultaneous read/write)[cite: 98, 99].",
  "<b>Opening Modes:</b>",
  "&bull; <code>ios::in</code>: Opens file for reading (fails if file does not exist)[cite: 98].",
  "&bull; <code>ios::out</code>: Opens file for writing (creates or overwrites existing file)[cite: 98, 99].",
  "&bull; <code>ios::app</code>: Append mode; all write operations occur at file end[cite: 99].",
  "&bull; <code>ios::ate</code>: Opens file and positions stream pointer at the end[cite: 99].",
  "&bull; <code>ios::trunc</code>: Truncates existing file content to 0 length[cite: 99].",
  "&bull; <code>ios::binary</code>: Opens file in raw binary mode instead of formatted text mode[cite: 98].",
  "<b>Combining Modes:</b> Modes are combined with bitwise OR: <code>fstream f(\"data.dat\", ios::in | ios::out | ios::binary);</code>[cite: 99]."
 ]
],
["4. Sequential Read & Write Operations",
 [
  "<b>Writing Text:</b> Using the insertion operator: <code>file &lt;&lt; \"Text\" &lt;&lt; endl;</code>[cite: 99, 100].",
  "<b>Reading Text:</b> Using extraction operator <code>file &gt;&gt; str;</code> (reads single words) or <code>getline(file, line);</code> (reads entire lines)[cite: 101, 102].",
  "<b>Closing Files:</b> <code>file.close()</code> flushes internal stream buffers and frees file handles to prevent leaks and corruption[cite: 102]."
 ]
],
["5. Binary Files vs ASCII Text Files",
 [
  "<b>Binary Files:</b> Store raw in-memory byte representations rather than ASCII text; requires <code>ios::binary</code>[cite: 106].",
  "<b>write() Function:</b> <code>file.write(reinterpret_cast&lt;const char*&gt;(&amp;data), sizeof(data));</code> writes raw memory blocks[cite: 106].",
  "<b>read() Function:</b> <code>file.read(reinterpret_cast&lt;char*&gt;(&amp;data), sizeof(data));</code> reads raw byte streams directly into memory variables[cite: 107, 108]."
 ]
],
["6. File Error Handling Functions",
 [
  "<b>is_open():</b> Returns <code>true</code> if the file stream has been successfully associated with an open file[cite: 103].",
  "<b>eof():</b> Returns <code>true</code> when stream reaches end-of-file condition[cite: 104, 105].",
  "<b>fail():</b> Returns <code>true</code> if an input/output operation failed or format error occurred.",
  "<b>bad():</b> Returns <code>true</code> if an unrecoverable read/write hardware or stream error occurred.",
  "<b>good():</b> Returns <code>true</code> if all error flag bits are clear and file is ready for I/O."
 ]
]],

const strip=s=>s.replace(/\/\*[\s\S]*?\*\//g,m=>m.replace(/[^\n]/g,"")).replace(/\/\/.*$/gm,"");
function compile(src){const c=strip(src),L=c.split("\n"),e=[];
 const add=(l,m)=>e.push(`main.cpp:${l}:1: error:${m}`);
 if(!/\bmain\s*\(/.test(c))e.push("/usr/bin/ld: undefined reference to `main'");
 const cnt=(a,b)=>(c.match(new RegExp("\\"+a,"g"))||[]).length-(c.match(new RegExp("\\"+b,"g"))||[]).length;
 if(cnt("{","}")>0)add(L.length,"expected '}' at end of input");if(cnt("{","}")<0)add(L.length,"expected declaration before '}' token");
 if(cnt("(",")")!=0)add(L.length,"unbalanced parentheses");
 if((c.replace(/\\"/g,"").match(/"/g)||[]).length%2)add(1,"missing terminating \" character");
 const std=/using\s+namespace\s+std/.test(c);
 L.forEach((l,i)=>{const t=l.trim();
  if(/\b(cout|cin|endl)\b/.test(t)&&!/std::/.test(t)&&!std)add(i+1,"'"+t.match(/\b(cout|cin|endl)\b/)[1]+"' was not declared in this scope; did you mean 'std::"+t.match(/\b(cout|cin|endl)\b/)[1]+"'?");
  else if(/\b(cout|cin)\b/.test(t)&&!/#include\s*<iostream>/.test(c))add(i+1,"'"+t.match(/\b(cout|cin)\b/)[1]+"' was not declared in this scope (missing #include <iostream>)");
  if(/\b(ifstream|ofstream|fstream)\b/.test(t)&&!/<fstream>/.test(c))add(i+1,"'"+t.match(/\b(i|o)?fstream\b/)[0]+"' was not declared in this scope (missing #include <fstream>)");
  if(!t||/^#|^(for|if|while|else|class|struct|template|public|private|protected|namespace|switch|case|default)\b/.test(t))return;
  if(!/[A-Za-z0-9_"'\]]$/.test(t))return;
  const nx=(L.slice(i+1).find(x=>x.trim())||"").trim();
  if(/^(<<|>>|[-+*\/=&|?:.,])/.test(nx)||/^\{/.test(nx))return;
  add(i+1,"expected ';' after statement");});
 return e}
function mEnd(s,i,o,c){let d=0;for(;i<s.length;i++){if(s[i]=='"'){i++;while(i<s.length&&s[i]!='"')i++}else if(s[i]==o)d++;else if(s[i]==c&&--d==0)return i}return s.length}
function one(s,i){let r=s.slice(i).trimStart();i=s.length-r.length;let m=r.match(/^(for|while|if)\s*\(/);
 if(m){const p=i+r.indexOf("("),e=mEnd(s,p,"(",")"),h=s.slice(p+1,e);let[b,j]=body(s,e+1);const n={t:m[1],h,b};
  if(m[1]=="if"){const r2=s.slice(j).trimStart();if(/^else\b/.test(r2)){let k=s.length-r2.length+4;const r3=s.slice(k).trimStart();if(/^if\b/.test(r3)){const[x,j2]=one(s,k);n.e=[x];j=j2}else{const[b2,j2]=body(s,k);n.e=b2;j=j2}}}
  return[n,j]}
 let j=i;while(j<s.length&&s[j]!=";"){if(s[j]=='"'){j++;while(j<s.length&&s[j]!='"')j++}j++}return[{t:"s",s:s.slice(i,j).trim()},j+1]}
function body(s,i){const r=s.slice(i).trimStart();i=s.length-r.length;if(s[i]=="{"){const e=mEnd(s,i,"{","}");return[parse(s.slice(i+1,e)),e+1]}const[n,j]=one(s,i);return[[n],j]}
function parse(s){const o=[];let i=0;while(s.slice(i).trim()){const[n,j]=one(s,i);o.push(n);i=j}return o}
function run(src){const c=strip(src),m=c.match(/int\s+main\s*\([^)]*\)\s*\{/);if(!m)return"error: no main()";
 const st=m.index+m[0].length,b=c.slice(st,mEnd(c,st-1,"{","}")),env={},ty={};let out="",steps=0;
 const ev=x=>{const k=Object.keys(env);return new Function(...k,"return ("+x+")")(...k.map(q=>env[q]))};
 const fmt=v=>typeof v=="boolean"?(v?1:0):v;
 const sp=(x,re)=>x.split(re);const QC=/,(?=(?:[^"]*"[^"]*")*[^"]*$)/,QL=/<<(?=(?:[^"]*"[^"]*")*[^"]*$)/;
 const set=(n,v)=>{env[n]=/^(int|long)$/.test(ty[n])&&typeof v=="number"?Math.trunc(v):v};
 function simple(s){let m;
  if(/^return\b/.test(s))throw"ret";
  if(m=s.match(/^cout\s*<<([\s\S]*)$/)){sp(m[1],QL).forEach(p=>{p=p.trim();out+=p=="endl"?"\n":fmt(ev(p))});return}
  if(m=s.match(/^(int|long|float|double|char|string|bool|auto)\s+([\s\S]+)$/)){sp(m[2],QC).forEach(d=>{const[a,...r]=d.split("=");const n=a.trim();if(!/^\w+$/.test(n))throw"unsupported declaration: "+s;ty[n]=m[1];set(n,r.length?ev(r.join("=")):0)});return}
  if(m=s.match(/^(\w+)\s*(\+\+|--)$/)){set(m[1],env[m[1]]+(m[2]=="++"?1:-1));return}
  if((m=s.match(/^(\w+)\s*([+\-*\/%]?)=\s*([\s\S]+)$/))&&m[1] in env){const v=m[2]?ev(m[1]+m[2]+"("+m[3]+")"):ev(m[3]);set(m[1],v);return}
  throw"unsupported statement: "+s}
 function exec(ns){for(const n of ns){if(++steps>1e5)throw"infinite loop? stopped after 100000 steps";
  if(n.t=="s")simple(n.s);
  else if(n.t=="if"){if(ev(n.h))exec(n.b);else if(n.e)exec(n.e)}
  else if(n.t=="while"){while(ev(n.h)){exec(n.b);steps++>1e5&&(()=>{throw"loop limit"})()}}
  else{const p=n.h.split(";");simple(p[0].trim());while(ev(p[1])){exec(n.b);simple(p[2].trim());if(++steps>1e5)throw"loop limit"}}}}
 try{exec(parse(b))}catch(e){if(e!="ret")return out+"\n[simulator] "+(e.message||e)}return out}
function sim(src,ex){const e=compile(src);
 let h="$ g++ -std=c++17 -Wall main.cpp -o main\n";
 if(e.length)return[h+e.join("\n")+`\n${e.length} error(s) generated. Compilation terminated.`,1];
 h+="Compilation successful (0 errors)\n$ ./main\n";
 const hit=ex.find(x=>x[1]==src);let o;
 if(hit)o=hit[2];else if(/\b(class|struct|template|new|ifstream|ofstream|virtual|cin)\b/.test(src))o="[simulator] Edited programs using classes, templates, pointers, files or cin cannot be executed here. Run the bundled example for its output, or try a basic-statement program.\n";
 else o=run(src);
 return[h+o+"[exit code 0]",0]}

function getBotReply(q, uIdx){

   return `<b>${note[0]}:</b><ul>${note[1].map(l=>"<li>"+l+"</li>").join("")}</ul>`;

  }
 }
 return `I'm your AI Tutor! In <b>${U[uIdx].n} (${U[uIdx].t})</b>, you can ask about: ${U[uIdx].notes.map(n=>n[0]).join(", ")}. Try selecting any suggested topic chip below or type concepts like "constructors", "inheritance", "friend functions", or "pure virtual functions"!`;
}

function askTutor(txt){
 if(!txt || !txt.trim()) return;
 const msgs = $("chatMsgs");
 msgs.innerHTML += `<div class="chat-msg user">${txt}</div>`;
 $("chatIn").value = "";
 msgs.scrollTop = msgs.scrollHeight;
 setTimeout(()=>{
  const reply = getBotReply(txt, cur);
  msgs.innerHTML += `<div class="chat-msg bot">${reply}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
 }, 200);
}

function askChip(noteIdx){
 const note = U[cur].notes[noteIdx];
 if(!note) return;
 const msgs = $("chatMsgs");
 msgs.innerHTML += `<div class="chat-msg user">Explain ${note[0]}</div>`;
 msgs.scrollTop = msgs.scrollHeight;
 setTimeout(()=>{
  const reply = `<b>${note[0]}:</b><ul>${note[1].map(l=>"<li>"+l+"</li>").join("")}</ul>`;
  msgs.innerHTML += `<div class="chat-msg bot">${reply}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
 }, 150);
}

/* ---- Theme Management ---- */
function initTheme(){
 const saved = localStorage.getItem("lumina_theme");
 if(saved) document.documentElement.setAttribute("data-theme", saved);
}
function toggleTheme(){
 const curr = document.documentElement.getAttribute("data-theme");
 const nxt = curr === "dark" ? "light" : "dark";
 document.documentElement.setAttribute("data-theme", nxt);
 localStorage.setItem("lumina_theme", nxt);
}
initTheme();

/* ---- UI ---- */
let cur=0;const done=(()=>{try{return JSON.parse(localStorage.getItem("oopdone")||"[]")}catch(e){return[]}})();
const save=()=>{try{localStorage.setItem("oopdone",JSON.stringify(done))}catch(e){}};
const $=id=>document.getElementById(id);
function prog(){$("pb").style.width=done.length/U.length*100+"\%";$("pt").textContent=done.length+" of "+U.length+" units complete"}
function show(i){cur=i;const u=U[i];
 $("nav").innerHTML=U.map((x,k)=>`<button class="${k==i?"on":""}" onclick="show(${k})">${x.n}${done.includes(k)?" ✓":""}</button>`).join("");
 $("m").innerHTML=`<div class="unit-head"><span class="unit-badge">Module Active</span><h2>${u.n}: ${u.t}</h2><p class="syl">${u.s}</p></div>
 <section><h3>📘 Syllabus &amp; Concept Notes</h3>${u.notes.map((n,k)=>`<details ${k==0?"open":""}><summary>${n[0]}</summary><ul>${n[1].map(l=>"<li>"+l+"</li>").join("")}</ul></details>`).join("")}</section>
 <section><h3>✨ AI Syllabus Tutor</h3>
  <p class="note">Ask any conceptual questions, syntax queries, or exam-focused doubts from ${u.n}.</p>
  <div class="chat-container">
    <div class="chat-msgs" id="chatMsgs">
      <div class="chat-msg bot">Greetings! I am your <b>AI Tutor</b> for <b>${u.n} (${u.t})</b>. Ask me anything or select a topic chip below to start!</div>
    </div>
    <div class="chat-chips" id="chatChips">
      ${u.notes.map((n,k)=>`<button class="chat-chip" onclick="askChip(${k})">${n[0]}</button>`).join("")}
    </div>
    <div class="chat-bar">
      <input type="text" id="chatIn" class="chat-in" placeholder="Ask a question about ${u.n}..." onkeydown="if(event.key==='Enter')askTutor(this.value)">
      <button class="btn" onclick="askTutor($('chatIn').value)">Ask</button>
    </div>
  </div>
 </section>
 <section><h3>⚡ g++ Compiler Studio</h3><div class="row"><select id="sel" onchange="load(this.value)">${u.ex.map((x,k)=>`<option value="${k}">${x[0]}</option>`).join("")}</select>
 <button class="btn" onclick="go()">Compile and run</button><button class="btn g" onclick="load($('sel').value)">Reset</button></div>
 <textarea id="src" spellcheck="false"></textarea><pre id="out">Press "Compile and run".</pre>
 <p class="note">Browser simulation: verifies g++ syntax, scope declarations, unbalanced braces, and header inclusions while executing core statements.</p></section>
 <section><h3>📝 Unit Evaluation (10 MCQs)</h3>${u.quiz.map((q,a)=>`<div class="q"><b>${q[0]}</b>${q[1].map((o,b)=>`<button onclick="ans(this,${q[2]==b})">${String.fromCharCode(65+b)}) ${o}</button>`).join("")}</div>`).join("")}</section>
 <button class="btn" onclick="fin()">${done.includes(i)?"Completed ✓":"Mark unit complete"}</button>`;
 load(0);prog();window.scrollTo(0,0)}
function load(k){$("src").value=U[cur].ex[k][1]}
function go(){const[r,bad]=sim($("src").value,U[cur].ex.map(x=>x));$("out").innerHTML="";$("out").textContent=r;$("out").className=bad?"err":""}
function ans(b,ok){[...b.parentNode.querySelectorAll("button")].forEach(x=>x.className="");b.className=ok?"r":"w"}
function fin(){if(!done.includes(cur))done.push(cur);save();show(cur)}
show(0);
</script>
</body>
</html>
